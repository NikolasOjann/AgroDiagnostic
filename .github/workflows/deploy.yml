name: CI/CD Pipeline AgroDiagnostic

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies & Run Mock Test
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic scikit-fuzzy numpy<2.0.0 Sastrawi networkx scipy packaging python-multipart
        python -c "print('Build & Syntax Test Berhasil!')"

  dockerize-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./Backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/agro-backend:latest

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./Frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/agro-frontend:latest

  deploy-to-ec2:
    needs: dockerize-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd ~/AgroDiagnostic
          sudo docker compose down
          sudo docker system prune -a -f
          
          # Ambil konfigurasi docker-compose terbaru
          git pull origin main || git pull origin master
          
          # Nyalakan kembali dengan image terbaru
          sudo docker compose pull
          sudo docker compose up -d
